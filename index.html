<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>ランダム指名・座席ルーレット</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7fb;
      --panel: #ffffff;
      --panel-2: #f9fafb;
      --text: #111827;
      --muted: #667085;
      --border: #d9dee8;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --accent-text: #1d4ed8;
      --winner: #16a34a;
      --winner-soft: #dcfce7;
      --danger: #dc2626;
      --shadow: 0 10px 30px rgba(15, 23, 42, .08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1020;
        --panel: #12192b;
        --panel-2: #182136;
        --text: #f3f4f6;
        --muted: #a8b0c0;
        --border: #2d3850;
        --accent: #60a5fa;
        --accent-soft: #1e3a5f;
        --accent-text: #bfdbfe;
        --winner: #4ade80;
        --winner-soft: #163f2a;
        --danger: #f87171;
        --shadow: 0 10px 30px rgba(0, 0, 0, .25);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button, input, textarea { font: inherit; }
    button { cursor: pointer; }

    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    .app {
      width: min(1100px, calc(100% - 24px));
      margin: 24px auto 48px;
    }

    .hero { margin-bottom: 18px; }

    .hero h1 {
      margin: 0 0 6px;
      font-size: clamp(1.45rem, 4vw, 2rem);
      line-height: 1.2;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: .95rem;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 18px;
      margin-bottom: 16px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(100px, 160px)) minmax(220px, 1fr);
      gap: 14px;
      align-items: end;
    }

    .field label,
    .label {
      display: block;
      font-size: .84rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    input[type="number"],
    input[type="text"],
    textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel-2);
      color: var(--text);
      padding: 9px 11px;
      outline: none;
    }

    input:focus,
    textarea:focus,
    button:focus-visible,
    .seat:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 32%, transparent);
      outline-offset: 2px;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 5px;
    }

    .mode-switch input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .mode-switch label {
      min-height: 42px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: var(--muted);
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      padding: 7px 10px;
      transition: background .18s ease, color .18s ease;
    }

    .mode-switch input:checked + label {
      background: var(--accent-soft);
      color: var(--accent-text);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
      align-items: center;
    }

    .btn {
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 9px 14px;
      background: var(--panel-2);
      color: var(--text);
      font-weight: 700;
    }

    .btn.primary {
      background: var(--accent);
      color: white;
      border-color: transparent;
    }

    .btn.danger { color: var(--danger); }

    .btn.layout-on {
      background: var(--accent-soft);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: .92rem;
      margin-left: auto;
    }

    .check input {
      width: 19px;
      height: 19px;
      accent-color: var(--accent);
    }

    .status {
      margin-top: 10px;
      color: var(--muted);
      font-size: .88rem;
      min-height: 1.4em;
    }

    .blackboard {
      text-align: center;
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 10px;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .seat-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .seat-counter {
      color: var(--muted);
      font-size: .88rem;
      font-weight: 700;
    }

    .seat-scroll {
      overflow-x: auto;
      padding: 5px 2px 12px;
    }

    .seat-grid {
      display: grid;
      gap: 9px;
      width: max-content;
      min-width: 100%;
      justify-content: center;
    }

    .seat {
      width: 122px;
      min-height: 92px;
      border: 2px solid var(--border);
      border-radius: 14px;
      background: var(--panel-2);
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition:
        transform .08s ease,
        border-color .08s ease,
        background .08s ease,
        box-shadow .08s ease,
        opacity .12s ease;
      position: relative;
      user-select: none;
    }

    .seat .seat-no {
      font-size: .74rem;
      color: var(--muted);
      font-weight: 800;
      letter-spacing: .02em;
    }

    .seat input {
      min-height: 38px;
      padding: 7px 8px;
      text-align: center;
      background: var(--panel);
    }

    .seat.inactive {
      opacity: .34;
      border-style: dashed;
      filter: grayscale(.35);
    }

    .seat.inactive input {
      cursor: not-allowed;
    }

    .seat-grid.editing .seat {
      cursor: pointer;
    }

    .seat-grid.editing .seat:hover {
      border-color: var(--accent);
    }

    .seat-grid.editing .seat input {
      pointer-events: none;
    }

    .seat-grid.editing .seat::before {
      content: "有効";
      position: absolute;
      top: 6px;
      right: 7px;
      font-size: .66rem;
      font-weight: 900;
      border-radius: 999px;
      padding: 2px 6px;
      color: var(--accent-text);
      background: var(--accent-soft);
    }

    .seat-grid.editing .seat.inactive::before {
      content: "無効";
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
    }

    .seat.seat-only input { opacity: .72; }

    .seat.roulette {
      opacity: 1;
      transform: scale(1.08);
      border-style: solid;
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent);
    }

    .seat.winner {
      opacity: 1;
      transform: scale(1.08);
      border-style: solid;
      border-color: var(--winner);
      background: var(--winner-soft);
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--winner) 24%, transparent);
    }

    .seat.picked::after {
      content: "済";
      position: absolute;
      bottom: 6px;
      right: 7px;
      font-size: .68rem;
      font-weight: 900;
      color: var(--muted);
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 999px;
      padding: 2px 6px;
    }

    .layout-guide {
      display: none;
      margin: 0 0 12px;
      padding: 11px 13px;
      border-radius: 11px;
      background: var(--accent-soft);
      color: var(--accent-text);
      font-size: .9rem;
      font-weight: 700;
    }

    .layout-guide.show { display: block; }

    .result {
      text-align: center;
      padding: 22px 16px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      border-radius: 16px;
      margin-top: 16px;
    }

    .result-kicker {
      color: var(--muted);
      font-size: .85rem;
    }

    .result-main {
      font-size: clamp(2rem, 7vw, 3.6rem);
      font-weight: 900;
      line-height: 1.1;
      margin: 8px 0 6px;
      overflow-wrap: anywhere;
    }

    .result-sub {
      color: var(--muted);
      font-size: .95rem;
    }

    .pick-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 14px;
    }

    .pick {
      min-height: 58px;
      border-radius: 14px;
      border: 0;
      font-size: 1.15rem;
      font-weight: 900;
      background: var(--accent);
      color: white;
      padding: 12px 20px;
    }

    .subgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .subpanel {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel-2);
      padding: 14px;
    }

    .subpanel h2 {
      font-size: 1rem;
      margin: 0 0 8px;
    }

    .subpanel p {
      color: var(--muted);
      font-size: .84rem;
      margin: 0 0 10px;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    .history {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      min-height: 42px;
      align-content: flex-start;
    }

    .chip {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: .84rem;
    }

    .hint {
      margin-top: 8px;
      color: var(--muted);
      font-size: .8rem;
    }

    @media (max-width: 760px) {
      .app {
        width: min(100% - 16px, 1100px);
        margin-top: 12px;
      }

      .panel {
        padding: 14px;
        border-radius: 14px;
      }

      .controls {
        grid-template-columns: 1fr 1fr;
      }

      .controls .mode-field {
        grid-column: 1 / -1;
      }

      .subgrid { grid-template-columns: 1fr; }

      .check {
        width: 100%;
        margin-left: 0;
      }

      .seat {
        width: 105px;
        min-height: 86px;
      }

      .seat-grid {
        grid-template-columns: repeat(var(--cols, 1), 105px) !important;
      }

      .pick-row { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
        animation-duration: .001ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <h1>ランダム指名・座席ルーレット</h1>
      <p>m行×n列の枠を作り、実際に使う席だけをクリックで有効化できます。</p>
    </header>

    <section class="panel" aria-label="設定">
      <div class="controls">
        <div class="field">
          <label for="rows">前後の列数</label>
          <input id="rows" type="number" min="1" max="12" value="5">
        </div>

        <div class="field">
          <label for="cols">左右の席数</label>
          <input id="cols" type="number" min="1" max="12" value="6">
        </div>

        <div class="mode-field">
          <div class="label">抽選モード</div>
          <div class="mode-switch" role="radiogroup" aria-label="抽選モード">
            <input id="mode-name" type="radio" name="mode" value="name" checked>
            <label for="mode-name">名前で抽選</label>
            <input id="mode-seat" type="radio" name="mode" value="seat">
            <label for="mode-seat">席だけで抽選</label>
          </div>
        </div>
      </div>

      <div class="toolbar">
        <button id="rebuild" class="btn" type="button">m×n を反映</button>
        <button id="layoutEdit" class="btn layout-on" type="button" aria-pressed="true">配置編集を終了</button>
        <button id="enableAll" class="btn" type="button">全席有効</button>
        <button id="disableAll" class="btn" type="button">全席無効</button>
        <button id="clearNames" class="btn danger" type="button">名前を全消去</button>

        <label class="check">
          <input id="excludePicked" type="checkbox" checked>
          一度当たった席は一巡するまで除外
        </label>
      </div>

      <div id="status" class="status" aria-live="polite"></div>
    </section>

    <section class="panel">
      <div class="blackboard">黒板・教室前方</div>

      <div class="seat-header">
        <strong>座席配置</strong>
        <span id="seatCounter" class="seat-counter">有効 0席 / 全0席</span>
      </div>

      <div id="layoutGuide" class="layout-guide show">
        配置編集中：使用する席をクリックしてください。濃く表示された席だけが抽選対象になります。
      </div>

      <div class="seat-scroll">
        <div id="seatGrid" class="seat-grid editing" aria-label="座席表"></div>
      </div>

      <div class="pick-row">
        <button id="pickButton" class="pick" type="button">ルーレット開始</button>
        <button id="resetPicked" class="btn" type="button">指名済みをリセット</button>
      </div>

      <div class="result" aria-live="polite" aria-atomic="true">
        <div class="result-kicker">今回の指名</div>
        <div id="resultMain" class="result-main">—</div>
        <div id="resultSub" class="result-sub">まず使用する席を有効化してください</div>
      </div>
    </section>

    <section class="panel">
      <div class="subgrid">
        <div class="subpanel">
          <h2>名前を一括入力</h2>
          <p>1行が横1列です。カンマ区切りで入力します。「-」の位置は無効席になります。</p>
          <textarea id="bulkInput" placeholder="田中,佐藤,-,鈴木&#10;山田,,高橋,-"></textarea>
          <div class="toolbar">
            <button id="applyBulk" class="btn" type="button">一括入力を反映</button>
          </div>
          <div class="hint">空欄は「有効だが名前なし」の席として扱われます。席だけで抽選する場合に便利です。</div>
        </div>

        <div class="subpanel">
          <h2>指名履歴</h2>
          <div id="history" class="history">
            <span class="hint">まだ指名されていません。</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const $ = (selector) => document.querySelector(selector);

      const rowsInput = $("#rows");
      const colsInput = $("#cols");
      const seatGrid = $("#seatGrid");
      const pickButton = $("#pickButton");
      const excludePicked = $("#excludePicked");
      const status = $("#status");
      const resultMain = $("#resultMain");
      const resultSub = $("#resultSub");
      const historyEl = $("#history");
      const bulkInput = $("#bulkInput");
      const layoutEditButton = $("#layoutEdit");
      const layoutGuide = $("#layoutGuide");
      const seatCounter = $("#seatCounter");

      const STORAGE_KEY = "classroom-seat-roulette-v3";

      let activeKeys = new Set();
      let pickedKeys = new Set();
      let history = [];
      let rouletteRunning = false;
      let layoutEditing = true;
      let activeRouletteKey = null;
      let winnerKey = null;

      function clampInt(value, min, max, fallback) {
        const parsed = Number.parseInt(value, 10);
        if (!Number.isFinite(parsed)) return fallback;
        return Math.min(max, Math.max(min, parsed));
      }

      function getMode() {
        return document.querySelector('input[name="mode"]:checked')?.value || "name";
      }

      function getSeatInputs() {
        return [...seatGrid.querySelectorAll("input[data-key]")];
      }

      function getSeatCards() {
        return [...seatGrid.querySelectorAll(".seat")];
      }

      function currentSeatData() {
        return getSeatInputs().map((input) => ({
          key: input.dataset.key,
          row: Number(input.dataset.row),
          col: Number(input.dataset.col),
          number: Number(input.dataset.number),
          name: input.value.trim(),
          enabled: activeKeys.has(input.dataset.key),
          input,
          card: input.closest(".seat")
        }));
      }

      function getCandidates() {
        const mode = getMode();
        let seats = currentSeatData().filter((seat) => seat.enabled);

        if (mode === "name") {
          seats = seats.filter((seat) => seat.name.length > 0);
        }

        if (excludePicked.checked) {
          const remaining = seats.filter((seat) => !pickedKeys.has(seat.key));
          if (remaining.length > 0) {
            seats = remaining;
          } else if (seats.length > 0) {
            pickedKeys.clear();
            updateSeatState();
            status.textContent = "候補が一巡したため、指名済みを自動でリセットしました。";
          }
        }

        return seats;
      }

      function seatLabel(seat) {
        const basic = `前から${seat.row + 1}列目・左から${seat.col + 1}番目`;
        return seat.name ? `${seat.name}（${basic}）` : `席 ${seat.number}（${basic}）`;
      }

      function resultLabel(seat) {
        if (getMode() === "seat") {
          return seat.name || `席 ${seat.number}`;
        }
        return seat.name;
      }

      function randomIndex(max) {
        if (max <= 1) return 0;
        if (window.crypto?.getRandomValues) {
          const range = 0x100000000;
          const limit = range - (range % max);
          const values = new Uint32Array(1);
          do {
            crypto.getRandomValues(values);
          } while (values[0] >= limit);
          return values[0] % max;
        }
        return Math.floor(Math.random() * max);
      }

      function chooseDifferentIndex(length, previousIndex) {
        if (length <= 1) return 0;
        let index = randomIndex(length);
        let guard = 0;
        while (index === previousIndex && guard < 8) {
          index = randomIndex(length);
          guard++;
        }
        return index;
      }

      function clearVisualSelection() {
        getSeatCards().forEach((card) => {
          card.classList.remove("roulette", "winner");
        });
        activeRouletteKey = null;
        winnerKey = null;
      }

      function showRouletteSeat(seat) {
        getSeatCards().forEach((card) => card.classList.remove("roulette", "winner"));
        seat.card.classList.add("roulette");
        activeRouletteKey = seat.key;
      }

      function showWinner(seat) {
        getSeatCards().forEach((card) => card.classList.remove("roulette", "winner"));
        seat.card.classList.add("winner");
        winnerKey = seat.key;
        activeRouletteKey = null;
        seat.card.scrollIntoView({
          behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth",
          block: "nearest",
          inline: "center"
        });
      }

      function updateSeatState() {
        const seats = currentSeatData();

        seats.forEach((seat) => {
          const isActive = activeKeys.has(seat.key);
          seat.card.classList.toggle("inactive", !isActive);
          seat.card.classList.toggle("picked", pickedKeys.has(seat.key) && isActive);
          seat.card.classList.toggle("seat-only", getMode() === "seat");
          seat.card.setAttribute("aria-pressed", String(isActive));
          seat.input.disabled = !isActive || layoutEditing;
          seat.input.placeholder = getMode() === "seat" ? "名前は任意" : "名前";
          seat.card.tabIndex = layoutEditing ? 0 : -1;
        });

        seatCounter.textContent = `有効 ${activeKeys.size}席 / 全${seats.length}席`;
        updatePickAvailability();
      }

      function toggleSeat(key) {
        if (!layoutEditing || rouletteRunning) return;

        if (activeKeys.has(key)) {
          activeKeys.delete(key);
          pickedKeys.delete(key);
          if (winnerKey === key || activeRouletteKey === key) clearVisualSelection();
        } else {
          activeKeys.add(key);
        }

        updateSeatState();
        saveState();
      }

      function setLayoutEditing(value) {
        if (rouletteRunning) return;
        layoutEditing = Boolean(value);
        seatGrid.classList.toggle("editing", layoutEditing);
        layoutGuide.classList.toggle("show", layoutEditing);
        layoutEditButton.classList.toggle("layout-on", layoutEditing);
        layoutEditButton.setAttribute("aria-pressed", String(layoutEditing));
        layoutEditButton.textContent = layoutEditing ? "配置編集を終了" : "配置を編集";

        updateSeatState();

        status.textContent = layoutEditing
          ? "配置編集中：クリックした席だけを有効・無効に切り替えられます。"
          : "配置編集を終了しました。名前入力や抽選ができます。";
      }

      function updateModeUI() {
        updateSeatState();

        if (layoutEditing) {
          status.textContent = "配置編集中：使用する席をクリックして有効化してください。";
        } else if (getMode() === "name") {
          status.textContent = "名前で抽選：有効な席のうち、名前が入力されている席だけが候補です。";
        } else {
          status.textContent = "席だけで抽選：有効な席は、名前が空欄でも候補です。";
        }

        saveState();
      }

      function updatePickAvailability() {
        const mode = getMode();
        const activeSeats = currentSeatData().filter((seat) => seat.enabled);
        const eligible = mode === "name"
          ? activeSeats.filter((seat) => seat.name.length > 0)
          : activeSeats;

        pickButton.disabled = rouletteRunning || layoutEditing || eligible.length === 0;

        if (!rouletteRunning && eligible.length === 0) {
          resultMain.textContent = "—";

          if (activeSeats.length === 0) {
            resultSub.textContent = "使用する席を有効化してください";
          } else if (mode === "name") {
            resultSub.textContent = "有効な席に名前を1人以上入力してください";
          } else {
            resultSub.textContent = "抽選できる有効席がありません";
          }
        } else if (!rouletteRunning && layoutEditing) {
          resultSub.textContent = "配置編集を終了すると抽選できます";
        }
      }

      function renderHistory() {
        historyEl.innerHTML = "";

        if (history.length === 0) {
          const empty = document.createElement("span");
          empty.className = "hint";
          empty.textContent = "まだ指名されていません。";
          historyEl.appendChild(empty);
          return;
        }

        [...history].reverse().forEach((item, reversedIndex) => {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.textContent = `${history.length - reversedIndex}. ${item}`;
          historyEl.appendChild(chip);
        });
      }

      function buildSeats({
        preserveNames = true,
        preserveLayout = true,
        defaultActive = false
      } = {}) {
        const oldSeats = currentSeatData();
        const oldNames = oldSeats.map((seat) => seat.input.value);
        const oldActive = oldSeats.map((seat) => seat.enabled);

        const rows = clampInt(rowsInput.value, 1, 12, 5);
        const cols = clampInt(colsInput.value, 1, 12, 6);

        rowsInput.value = rows;
        colsInput.value = cols;

        seatGrid.innerHTML = "";
        seatGrid.style.setProperty("--cols", cols);
        seatGrid.style.gridTemplateColumns = `repeat(${cols}, 122px)`;

        activeKeys.clear();

        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const index = row * cols + col;
            const number = index + 1;
            const key = `${row}-${col}`;

            const card = document.createElement("div");
            card.className = "seat";
            card.dataset.key = key;
            card.setAttribute("role", "button");

            const seatNo = document.createElement("div");
            seatNo.className = "seat-no";
            seatNo.textContent = `席 ${number}`;

            const input = document.createElement("input");
            input.type = "text";
            input.autocomplete = "off";
            input.dataset.key = key;
            input.dataset.row = String(row);
            input.dataset.col = String(col);
            input.dataset.number = String(number);
            input.value = preserveNames ? (oldNames[index] || "") : "";
            input.setAttribute("aria-label", `席${number}の名前`);

            const active = preserveLayout && index < oldActive.length
              ? oldActive[index]
              : defaultActive;

            if (active) activeKeys.add(key);

            input.addEventListener("input", () => {
              pickedKeys.delete(key);
              card.classList.remove("picked");
              if (winnerKey === key || activeRouletteKey === key) clearVisualSelection();
              updatePickAvailability();
              saveState();
            });

            card.addEventListener("click", (event) => {
              if (!layoutEditing) return;
              event.preventDefault();
              toggleSeat(key);
            });

            card.addEventListener("keydown", (event) => {
              if (!layoutEditing) return;
              if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                toggleSeat(key);
              }
            });

            card.append(seatNo, input);
            seatGrid.appendChild(card);
          }
        }

        pickedKeys.clear();
        clearVisualSelection();
        updateSeatState();
        saveState();
      }

      function rouletteDelays() {
        const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduced) return [80, 100, 120, 140];

        const delays = [];
        for (let i = 0; i < 22; i++) {
          const t = i / 21;
          delays.push(Math.round(45 + Math.pow(t, 2.15) * 230));
        }
        return delays;
      }

      async function startRoulette() {
        if (rouletteRunning || layoutEditing) return;

        let candidates = getCandidates();
        if (candidates.length === 0) {
          updatePickAvailability();
          return;
        }

        rouletteRunning = true;
        pickButton.disabled = true;
        pickButton.textContent = "抽選中…";
        resultMain.textContent = "…";
        resultSub.textContent = "ルーレット中";
        clearVisualSelection();

        const delays = rouletteDelays();
        let previousIndex = -1;

        for (const delay of delays) {
          candidates = getCandidates();
          if (candidates.length === 0) break;

          const index = chooseDifferentIndex(candidates.length, previousIndex);
          previousIndex = index;
          showRouletteSeat(candidates[index]);

          await new Promise((resolve) => setTimeout(resolve, delay));
        }

        candidates = getCandidates();

        if (candidates.length === 0) {
          rouletteRunning = false;
          pickButton.textContent = "ルーレット開始";
          updatePickAvailability();
          return;
        }

        const finalSeat = candidates[randomIndex(candidates.length)];
        showWinner(finalSeat);

        if (excludePicked.checked) {
          pickedKeys.add(finalSeat.key);
          updateSeatState();
        }

        const main = resultLabel(finalSeat);
        resultMain.textContent = main;
        resultSub.textContent = seatLabel(finalSeat);

        history.push(main);
        if (history.length > 30) history.shift();
        renderHistory();

        rouletteRunning = false;
        pickButton.textContent = "もう一度回す";
        updatePickAvailability();
        saveState();
      }

      function resetPickedState() {
        if (rouletteRunning) return;

        pickedKeys.clear();
        clearVisualSelection();
        updateSeatState();

        resultMain.textContent = "—";
        resultSub.textContent = "指名済みをリセットしました";
        status.textContent = "指名済み状態をリセットしました。";

        saveState();
      }

      function clearAllNames() {
        if (rouletteRunning) return;

        getSeatInputs().forEach((input) => {
          input.value = "";
        });

        pickedKeys.clear();
        history = [];
        clearVisualSelection();
        updateSeatState();
        renderHistory();

        resultMain.textContent = "—";
        resultSub.textContent = "名前をすべて消去しました";
        status.textContent = getMode() === "seat"
          ? "席だけで抽選モードなら、名前なしでそのまま使えます。"
          : "名前で抽選する場合は、有効な席に名前を入力してください。";

        saveState();
      }

      function setAllSeatsActive(active) {
        if (rouletteRunning) return;

        activeKeys.clear();

        if (active) {
          currentSeatData().forEach((seat) => activeKeys.add(seat.key));
        } else {
          pickedKeys.clear();
          clearVisualSelection();
        }

        updateSeatState();
        status.textContent = active
          ? "すべての席を有効にしました。"
          : "すべての席を無効にしました。使用する席だけクリックして有効化してください。";

        saveState();
      }

      function applyBulk() {
        if (rouletteRunning) return;

        const raw = bulkInput.value;
        if (!raw.trim()) {
          status.textContent = "一括入力欄が空です。";
          return;
        }

        const matrix = raw.split(/\r?\n/).map((line) =>
          line.split(",").map((value) => value.trim())
        );

        const rows = Math.min(12, Math.max(1, matrix.length));
        const cols = Math.min(
          12,
          Math.max(1, ...matrix.map((row) => row.length))
        );

        rowsInput.value = rows;
        colsInput.value = cols;

        buildSeats({
          preserveNames: false,
          preserveLayout: false,
          defaultActive: false
        });

        const inputs = getSeatInputs();
        activeKeys.clear();

        matrix.slice(0, rows).forEach((row, rowIndex) => {
          row.slice(0, cols).forEach((value, colIndex) => {
            const input = inputs[rowIndex * cols + colIndex];
            if (!input) return;

            const key = input.dataset.key;

            if (value !== "-") {
              activeKeys.add(key);
              input.value = value;
            } else {
              input.value = "";
            }
          });
        });

        pickedKeys.clear();
        clearVisualSelection();
        updateSeatState();

        status.textContent = "一括入力を反映しました。「-」以外の位置を有効席に設定しています。";
        saveState();
      }

      function saveState() {
        try {
          const seats = currentSeatData();

          const payload = {
            version: 3,
            rows: Number(rowsInput.value),
            cols: Number(colsInput.value),
            mode: getMode(),
            excludePicked: excludePicked.checked,
            names: seats.map((seat) => seat.input.value),
            active: seats.map((seat) => activeKeys.has(seat.key)),
            history
          };

          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        } catch (_) {
          // 保存不可の環境でもアプリ自体は動作させる
        }
      }

      function restoreState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);

          if (!raw) {
            buildSeats({
              preserveNames: false,
              preserveLayout: false,
              defaultActive: false
            });
            renderHistory();
            setLayoutEditing(true);
            return;
          }

          const data = JSON.parse(raw);

          rowsInput.value = clampInt(data.rows, 1, 12, 5);
          colsInput.value = clampInt(data.cols, 1, 12, 6);

          const modeInput = document.querySelector(
            `input[name="mode"][value="${data.mode === "seat" ? "seat" : "name"}"]`
          );
          if (modeInput) modeInput.checked = true;

          excludePicked.checked = data.excludePicked !== false;

          buildSeats({
            preserveNames: false,
            preserveLayout: false,
            defaultActive: false
          });

          const inputs = getSeatInputs();

          if (Array.isArray(data.names)) {
            data.names.slice(0, inputs.length).forEach((name, index) => {
              inputs[index].value = typeof name === "string" ? name : "";
            });
          }

          activeKeys.clear();

          if (Array.isArray(data.active)) {
            data.active.slice(0, inputs.length).forEach((isActive, index) => {
              if (isActive) activeKeys.add(inputs[index].dataset.key);
            });
          } else {
            // 旧バージョンの保存データ互換
            inputs.forEach((input) => activeKeys.add(input.dataset.key));
          }

          history = Array.isArray(data.history)
            ? data.history.filter((item) => typeof item === "string").slice(-30)
            : [];

          renderHistory();
          setLayoutEditing(false);
          updateModeUI();
          updateSeatState();
        } catch (_) {
          buildSeats({
            preserveNames: false,
            preserveLayout: false,
            defaultActive: false
          });
          renderHistory();
          setLayoutEditing(true);
        }
      }

      $("#rebuild").addEventListener("click", () => {
        if (rouletteRunning) return;

        buildSeats({
          preserveNames: true,
          preserveLayout: true,
          defaultActive: false
        });

        setLayoutEditing(true);
        status.textContent = "m×n を反映しました。追加された席は無効です。使用する席だけクリックしてください。";
      });

      layoutEditButton.addEventListener("click", () => {
        setLayoutEditing(!layoutEditing);
        saveState();
      });

      $("#enableAll").addEventListener("click", () => setAllSeatsActive(true));
      $("#disableAll").addEventListener("click", () => setAllSeatsActive(false));
      $("#clearNames").addEventListener("click", clearAllNames);
      $("#resetPicked").addEventListener("click", resetPickedState);
      $("#applyBulk").addEventListener("click", applyBulk);
      pickButton.addEventListener("click", startRoulette);

      excludePicked.addEventListener("change", () => {
        pickedKeys.clear();
        updateSeatState();

        status.textContent = excludePicked.checked
          ? "一度当たった席を、一巡するまで除外します。"
          : "毎回すべての候補席から抽選します。";

        saveState();
      });

      document.querySelectorAll('input[name="mode"]').forEach((radio) => {
        radio.addEventListener("change", () => {
          pickedKeys.clear();
          clearVisualSelection();
          updateModeUI();
        });
      });

      rowsInput.addEventListener("change", saveState);
      colsInput.addEventListener("change", saveState);

      restoreState();
    })();
  </script>
</body>
</html>
